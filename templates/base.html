<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1119">
  <title>{% block title %}BGMI Win Probability{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=3d-arena-3">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="game-world" aria-hidden="true">
    <div class="world-haze"></div>
    <div class="world-depth-grid"></div>
  </div>
  <header class="topbar">
    <a class="brand" href="{{ url_for('home') }}" aria-label="BGMI probability home">
      <span class="brand-mark">B</span>
      <span>BGMI <b>ANALYTICS</b></span>
    </a>
    <button class="menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" data-menu-toggle>☰</button>
    <nav class="nav-links" data-nav>
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('live') }}">Live BMSD</a>
      <a href="{{ url_for('mvp') }}">MVP</a>
      <a href="{{ url_for('predict_page') }}">Predict</a>
      <a href="{{ url_for('compare') }}">Compare</a>
      <a href="{{ url_for('model_analytics') }}">Model</a>
      <a href="{{ url_for('about') }}">Methodology</a>
    </nav>
  </header>
  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <span>BGMI Tournament Win Probability</span>
    <span>Historical match data · calibrated model estimate</span>
  </footer>
  <script src="{{ url_for('static', filename='js/script.js') }}?v=3d-arena-3" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
